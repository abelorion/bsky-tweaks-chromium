<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background-color: #161e27;
      color: #ffffff;
    }
    .header {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .feature-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .label {
      font-size: 13px;
      color: #d1d5db;
    }
    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #374151;
      transition: .2s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #0f73ff;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
  </style>
</head>
<body>
  <div class="header">Bluesky Options</div>
  
  <div class="feature-row">
    <span class="label">Hide Followers</span>
    <label class="switch">
      <input type="checkbox" id="hideFollowersToggle">
      <span class="slider"></span>
    </label>
  </div>
</br>
  <div class="feature-row">
    <span class="label">Hide Mutuals</span>
    <label class="switch">
      <input type="checkbox" id="hideMutualsToggle">
      <span class="slider"></span>
    </label>
  </div>

<script src="feature_sync.js"></script>
</body>
</html>
